name: Release

# APK'yı GitHub üzerinde derler, imzalar, doğrular ve GitHub Release'e ekler.
# Repoda APK tutulmaz.
#
# İmza anahtarı GitHub Secrets'tan gelir (Settings → Secrets and variables → Actions):
#   BESTPHOTO_KEYSTORE_BASE64   keystore dosyasının base64 hali
#   BESTPHOTO_KEYSTORE_PASSWORD keystore şifresi
#   BESTPHOTO_KEY_ALIAS         anahtar adı
#   BESTPHOTO_KEY_PASSWORD      anahtar şifresi
# Secret'lar tanımlı değilse repodaki keystore/bestphoto.keystore kullanılır
# (uyarı verilir). Her iki durumda da imza parmak izi beklenenle eşleşmezse
# release oluşturulmaz: telefondaki kurulumun üzerine güncellenebilmesi için
# anahtar hep aynı olmalı.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (örn. 2.1.1) — app/build.gradle.kts'deki versionName ile aynı olmalı"
        required: true
      dry_run:
        description: "Yalnızca derle ve doğrula; Release oluşturma (APK artifact olarak yüklenir)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  EXPECTED_CERT_SHA256: 1057c59f03a81012e7d916bf9ffadc36e743c8531cb04dd96b334641cc6be66e

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Üçüncü taraf eylemler commit SHA'sına sabitlenir: etiket sonradan başka
      # bir koda taşınsa bile burada çalışan kod değişmez.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Girdi kabuğa doğrudan gömülmez (komut enjeksiyonu riski); ortam
      # değişkeniyle geçirilip önce biçimi ve koddaki sürümle eşleşmesi doğrulanır.
      - name: Sürümü doğrula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Geçersiz sürüm: '$VERSION' (beklenen biçim: 2.1.1)"
            exit 1
          fi
          CODE_VERSION=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "$CODE_VERSION" != "$VERSION" ]; then
            echo "::error::Girilen sürüm ($VERSION) app/build.gradle.kts'deki versionName ($CODE_VERSION) ile aynı değil"
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.BESTPHOTO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BESTPHOTO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BESTPHOTO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BESTPHOTO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            {
              echo "BESTPHOTO_KEYSTORE_PATH=$KS"
              echo "BESTPHOTO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "BESTPHOTO_KEY_ALIAS=$KEY_ALIAS"
              echo "BESTPHOTO_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "İmza anahtarı GitHub Secrets'tan alındı."
          else
            echo "::warning::BESTPHOTO_KEYSTORE_BASE64 secret'ı tanımlı değil; repodaki keystore/bestphoto.keystore kullanılıyor."
          fi

      - name: Birim testleri ve imzalı release derlemesi
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: APK'yı doğrula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          SRC=app/build/outputs/apk/release/app-release.apk
          APK="$RUNNER_TEMP/BestPhotoSelect-v${VERSION}.apk"
          cp "$SRC" "$APK"
          # Projeyle aynı build-tools sürümü tercih edilir; runner'daki en yeni
          # sürümün çıktı biçimi ya da Java gereksinimi farklı olabilir.
          if [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            BT="$ANDROID_HOME/build-tools/35.0.0"
          else
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          fi
          echo "build-tools: $BT"

          BADGING=$("$BT/aapt2" dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.bestphotoselect'" || { echo "::error::Paket adı yanlış"; exit 1; }
          echo "$BADGING" | grep -q "versionName='${VERSION}'" || { echo "::error::APK versionName ${VERSION} değil"; exit 1; }

          ABIS=$(unzip -Z1 "$APK" | sed -nE 's|^lib/([^/]+)/.*|\1|p' | sort -u | tr '\n' ' ')
          echo "ABI'ler: $ABIS"
          [ "$ABIS" = "arm64-v8a armeabi-v7a " ] || { echo "::error::Beklenmeyen ABI'ler: $ABIS"; exit 1; }

          # Tam çıktı (hatalar dahil) kayda yazılır; araç hata verirse adım o hatayla durur.
          SIGNER_OUT=$("$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1) || {
            echo "$SIGNER_OUT"
            echo "::error::apksigner doğrulaması başarısız"
            exit 1
          }
          echo "$SIGNER_OUT"
          CERT=$(echo "$SIGNER_OUT" | grep -oiE 'certificate SHA-256 digest: *[0-9a-f:]{64,95}' | head -1 \
            | sed -E 's/.*digest: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "İmza SHA-256: $CERT"
          [ "$CERT" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::İmza parmak izi beklenenle eşleşmiyor"; exit 1; }

          ls -l "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: APK'yı artifact olarak yükle (deneme çalıştırması)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BestPhotoSelect-v${{ inputs.version }}
          path: ${{ env.APK_PATH }}

      - name: GitHub Release oluştur
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ inputs.version }}
          name: BestPhotoSelect v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.APK_PATH }}
          body: |
            BestPhotoSelect v${{ inputs.version }} imzalı release APK'sı (GitHub Actions'ta derlendi).

            - Desteklenen ABI'ler: arm64-v8a, armeabi-v7a
            - İmza SHA-256: ${{ env.EXPECTED_CERT_SHA256 }}

      # Telefona ntfy bildirimi: dokununca APK doğrudan indirilir. Repo herkese
      # açık olduğundan link GitHub girişi gerektirmez. ntfy konuları da herkese
      # açıktır; bu yüzden mesajda yalnızca zaten açık olan bilgiler yer alır.
      # Deneme çalıştırmasında "[DENEME]" başlıklı bildirim, en son yayınlanmış
      # APK'nın linkiyle gönderilir (hiçbir şey yayınlanmaz).
      - name: ntfy bildirimi gönder
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          NTFY_TOPIC: yusufkilinc-bestphotoselect
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [ "$DRY_RUN" = "true" ]; then
            URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '[.assets[] | select(.name | endswith(".apk"))][0].browser_download_url // empty')
            [ -n "$URL" ] || { echo "::error::Yayınlanmış bir APK bulunamadı"; exit 1; }
            TITLE="[DENEME] BestPhotoSelect bildirim testi"
            INTRO="Deneme bildirimi: v${VERSION} derlemesi doğrulandı, yayınlanmadı. Son yayınlanmış APK:"
          else
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/BestPhotoSelect-v${VERSION}.apk"
            TITLE="BestPhotoSelect v${VERSION} hazır"
            INTRO="Yeni sürüm yayınlandı. İndirmek için dokunun:"
          fi
          echo "Link: $URL"
          jq -n --arg topic "$NTFY_TOPIC" --arg title "$TITLE" --arg intro "$INTRO" --arg url "$URL" '{
            topic: $topic,
            title: $title,
            message: ($intro + "\n" + $url),
            tags: ["package"],
            click: $url,
            actions: [{action: "view", label: "APK indir", url: $url}]
          }' | curl -sS --fail --retry 3 -H "Content-Type: application/json" -d @- https://ntfy.sh/
