name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (örn. 2.1.1) — releases/BestPhotoSelect-v<sürüm>.apk release'e eklenir"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Üçüncü taraf eylemler commit SHA'sına sabitlenir: etiket sonradan başka
      # bir koda taşınsa bile burada çalışan kod değişmez.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Girdi kabuğa doğrudan gömülmez (komut enjeksiyonu riski); ortam
      # değişkeniyle geçirilip önce biçimi doğrulanır.
      - name: Sürümü doğrula ve APK var mı kontrol et
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Geçersiz sürüm: '$VERSION' (beklenen biçim: 2.1.1)" >&2
            exit 1
          fi
          test -f "releases/BestPhotoSelect-v${VERSION}.apk"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ inputs.version }}
          name: BestPhotoSelect v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: releases/BestPhotoSelect-v${{ inputs.version }}.apk
          body: |
            BestPhotoSelect v${{ inputs.version }} imzalı release APK'sı.

            - Desteklenen ABI'ler: arm64-v8a, armeabi-v7a
            - İmza SHA-256: 1057c59f03a81012e7d916bf9ffadc36e743c8531cb04dd96b334641cc6be66e
